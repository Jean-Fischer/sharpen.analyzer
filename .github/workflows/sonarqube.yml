name: SonarQube Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube Analysis
    if: github.actor != 'dependabot[bot]'
    runs-on: windows-latest

    steps:
      # Setup .NET (required for build)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Setup Java (required for SonarQube)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      # Checkout code
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for SonarQube analysis

      # Install SonarQube scanner
      - name: Install SonarQube scanner
        shell: powershell
        run: dotnet tool install --global dotnet-sonarscanner

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore "Sharpen.Analyzer/Sharpen.Analyzer.sln"

      # Begin SonarQube analysis
      - name: Begin SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          dotnet sonarscanner begin /k:"Jean-Fischer_sharpen.analyzer" /o:"jean-fischer" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.cs.opencover.reportsPaths="Sharpen.Analyzer/TestResults/**/coverage.opencover.xml"

      # Build project
      - name: Build
        run: dotnet build "Sharpen.Analyzer/Sharpen.Analyzer.sln" --configuration Release --no-restore

      # Run tests and collect OpenCover coverage for SonarQube
      - name: Run tests with coverage
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $resultsDirectory = "Sharpen.Analyzer/TestResults"

          if (Test-Path $resultsDirectory) { Remove-Item -Recurse -Force $resultsDirectory }

          dotnet test "Sharpen.Analyzer/Sharpen.Analyzer.sln" --configuration Release --no-build --collect:"XPlat Code Coverage;Format=opencover" --results-directory $resultsDirectory --verbosity normal

          $coverageFiles = Get-ChildItem -Path $resultsDirectory -Recurse -Filter "coverage.opencover.xml"
          if ($coverageFiles.Count -eq 0) { throw "Coverage file not found under $resultsDirectory" }

      # End SonarQube analysis
      - name: End SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
